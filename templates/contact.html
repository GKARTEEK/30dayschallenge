<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#071126;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .contact-box{
            background:#0f172a;
            padding:50px;
            border-radius:25px;
            text-align:center;
            width:100%;
            max-width:600px;
        }

        h1{
            font-size:45px;
            margin-bottom:20px;
            color:#22c55e;
        }

        p{
            font-size:20px;
            margin-bottom:30px;
            color:#dbe4ff;
        }

        .contact-btn{
            display:inline-block;
            background:#22c55e;
            color:white;
            text-decoration:none;
            padding:15px 35px;
            border-radius:12px;
            font-size:20px;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="contact-box">

        <h1>📧 Contact Us</h1>

        <p>
            Need help or support?
            Reach out anytime.
        </p>

        <a
            href="mailto:neurobits564@gmail.com"
            class="contact-btn"
        >
            Send Email
        </a>

    </div>

</body>
</html>
