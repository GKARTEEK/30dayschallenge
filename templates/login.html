{% extends 'base.html' %}

{% block content %}

<style>

.login-container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    background:#f8fafc;
}

.login-card{
    width:100%;
    max-width:450px;
    background:white;
    padding:45px;
    border-radius:30px;
    box-shadow:0 10px 40px rgba(0,0,0,0.08);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo h1{
    font-size:38px;
    font-weight:800;
    color:#22c55e;
}

.title{
    text-align:center;
    margin-bottom:10px;
    font-size:32px;
    font-weight:800;
    color:#0f172a;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:35px;
    font-size:16px;
    line-height:1.6;
}

.error-box{
    background:#fee2e2;
    color:#dc2626;
    padding:14px;
    border-radius:14px;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    margin-bottom:10px;
    color:#0f172a;
    font-weight:700;
}

.form-group input{
    width:100%;
    padding:16px;
    border:2px solid #e2e8f0;
    outline:none;
    border-radius:16px;
    background:white;
    color:#0f172a;
    font-size:15px;
    transition:0.3s;
}

.form-group input:focus{
    border-color:#22c55e;
    box-shadow:0 0 0 4px rgba(34,197,94,0.15);
}

.login-btn{
    width:100%;
    padding:16px;

    background:#22c55e;

    border:none;
    border-radius:16px;

    color:white;

    font-size:18px;
    font-weight:700;

    cursor:pointer;

    transition:0.3s;
}

.login-btn:hover{
    background:#16a34a;
    transform:translateY(-2px);
}

.register-link{
    text-align:center;
    margin-top:28px;
    color:#64748b;
    font-size:15px;
}

.register-link a{
    color:#22c55e;
    text-decoration:none;
    font-weight:700;
}

.welcome-box{
    text-align:center;
    margin-bottom:28px;
}

.welcome-badge{
    display:inline-block;

    background:#dcfce7;

    color:#15803d;

    padding:12px 20px;

    border-radius:999px;

    font-size:14px;
    font-weight:700;
}

.forgot-password{
    text-align:right;
    margin-top:10px;
}

.forgot-password a{
    color:#22c55e;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

</style>

<div class="login-container">

    <div class="login-card">

        <!-- Logo -->

        <div class="logo">

            <h1>
                ⚡ 30DaysChallenge
            </h1>

        </div>

        <!-- Welcome Badge -->

        <div class="welcome-box">

            <div class="welcome-badge">

                🚀 Continue Your Coding Journey

            </div>

        </div>

        <!-- Heading -->

        <h2 class="title">

            Welcome Back

        </h2>

        <p class="subtitle">

            Login to continue your
            daily coding challenge

        </p>

        <!-- Error -->

        {% if error %}

        <div class="error-box">

            {{ error }}

        </div>

        {% endif %}

        <!-- Form -->

        <form method="POST">

            {% csrf_token %}

            <!-- Username -->

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
                >

            </div>

            <!-- Password -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
                >

                <div class="forgot-password">

                    <a href="#">

                        Forgot Password?

                    </a>

                </div>

            </div>

            <!-- Button -->

            <button
            type="submit"
            class="login-btn"
            >

                Login

            </button>

        </form>

        <!-- Footer -->

        <div class="register-link">

            Don’t have an account?

            <a href="/register/">

                Create Account

            </a>

        </div>

    </div>

</div>

{% endblock %}
