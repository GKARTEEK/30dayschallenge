{% extends 'base.html' %}

{% block content %}

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    .login-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        position: relative;
        overflow: hidden;
    }

    .login-container::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 20% 50%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(34, 197, 94, 0.04) 0%, transparent 50%);
        pointer-events: none;
        z-index: 1;
    }

    .login-card {
        width: 100%;
        max-width: 450px;
        background: rgba(30, 41, 59, 0.6);
        backdrop-filter: blur(20px);
        padding: 50px;
        border-radius: 24px;
        border: 1px solid rgba(34, 197, 94, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        position: relative;
        z-index: 2;
    }

    .logo {
        text-align: center;
        margin-bottom: 30px;
    }

    .logo h1 {
        font-size: 42px;
        font-weight: 800;
        background: linear-gradient(135deg, #22c55e 0%, #86efac 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .welcome-box {
        text-align: center;
        margin-bottom: 30px;
    }

    .welcome-badge {
        display: inline-block;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        color: #86efac;
        padding: 10px 20px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 700;
    }

    .title {
        text-align: center;
        margin-bottom: 12px;
        font-size: 32px;
        font-weight: 800;
        color: #e2e8f0;
    }

    .subtitle {
        text-align: center;
        color: #cbd5e1;
        margin-bottom: 35px;
        font-size: 15px;
        line-height: 1.6;
    }

    .error-box {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        padding: 14px 16px;
        border-radius: 12px;
        margin-bottom: 20px;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 10px;
        color: #e2e8f0;
        font-weight: 700;
        font-size: 15px;
    }

    .form-group input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid rgba(34, 197, 94, 0.2);
        outline: none;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.5);
        color: #e2e8f0;
        font-size: 15px;
        transition: 0.3s;
    }

    .form-group input::placeholder {
        color: #64748b;
    }

    .form-group input:focus {
        border-color: rgba(34, 197, 94, 0.5);
        background: rgba(15, 23, 42, 0.7);
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
    }

    .forgot-password {
        text-align: right;
        margin-top: 8px;
    }

    .forgot-password a {
        color: #22c55e;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        transition: 0.3s;
    }

    .forgot-password a:hover {
        color: #86efac;
    }

    .login-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        margin-top: 10px;
    }

    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
    }

    .register-link {
        text-align: center;
        margin-top: 28px;
        color: #cbd5e1;
        font-size: 15px;
    }

    .register-link a {
        color: #22c55e;
        text-decoration: none;
        font-weight: 700;
        transition: 0.3s;
    }

    .register-link a:hover {
        color: #86efac;
    }

</style>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <h1>⚡ 30DaysChallenge</h1>
        </div>

        <div class="welcome-box">
            <div class="welcome-badge">🚀 Continue Your Coding Journey</div>
        </div>

        <h2 class="title">Welcome Back</h2>

        <p class="subtitle">Login to continue your daily coding challenge</p>

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>
            </div>

            <button type="submit" class="login-btn">Login</button>

        </form>

        <div class="register-link">
            Don't have an account? <a href="/register/">Create Account</a>
        </div>

    </div>

</div>

{% endblock %}
