<!DOCTYPE html>
<html>
<head>
    <title>Payment Failed</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f8fafc;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .card{
            background:white;
            padding:50px;
            border-radius:24px;
            width:420px;
            text-align:center;
            box-shadow:0 10px 40px rgba(0,0,0,0.1);
        }

        .icon{
            font-size:70px;
            margin-bottom:20px;
        }

        h1{
            color:#ef4444;
            margin-bottom:15px;
        }

        p{
            color:#64748b;
            margin-bottom:30px;
            line-height:1.6;
        }

        .btn{
            display:inline-block;
            background:#22c55e;
            color:white;
            padding:14px 28px;
            border-radius:14px;
            text-decoration:none;
            font-weight:700;
        }

        .btn:hover{
            background:#16a34a;
        }
    </style>
</head>
<body>

<div class="card">

    <div class="icon">❌</div>

    <h1>Payment Failed</h1>

    <p>
        Something went wrong with your payment.
        Please try again.
    </p>

    <a href="/courses/" class="btn">
        Back to Courses
    </a>

</div>

</body>
</html>
